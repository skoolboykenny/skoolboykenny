<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f04e14">
<title>Maru Power</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <a href="#/" class="brand" aria-label="Maru Power home">
    <img src="/icon.svg" alt="" width="34" height="34"><span>maru<b>power</b></span>
  </a>
  <div class="top-actions" id="topActions" hidden>
    <a href="#/notifications" class="icon-btn" aria-label="Notifications" id="bell">
      <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="dot" id="bellDot" hidden></span>
    </a>
    <button class="icon-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
</header>
<nav class="drawer" id="drawer" hidden>
  <a href="#/">Dashboard</a>
  <a href="#/buy">Buy electricity</a>
  <a href="#/meters">My meters</a>
  <a href="#/history">Purchase history</a>
  <a href="#/wallet">Wallet &amp; FNB account</a>
  <a href="#/calculator">Appliance calculator</a>
  <a href="#/alerts">Alerts &amp; auto-buy</a>
  <a href="#/profile">Profile</a>
  <button id="logoutBtn" class="link danger">Sign out</button>
</nav>
<main id="app" tabindex="-1"></main>
<nav class="tabbar" id="tabbar" hidden>
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#/buy" data-tab="buy"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Buy</a>
  <a href="#/meters" data-tab="meters"><svg viewBox="0 0 24 24"><path d="M12 14l4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/></svg>Meters</a>
  <a href="#/history" data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 3 2V2l-3 2-3-2-3 2-3-2-3 2z"/><path d="M8 9h8M8 13h6"/></svg>History</a>
  <a href="#/wallet" data-tab="wallet"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M16 15h2"/></svg>Wallet</a>
</nav>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<footer class="foot">Maru Power · <a href="#/help">Help</a> · <a href="#/terms">Terms</a></footer>
<script src="/app.js"></script>
</body>
</html>
