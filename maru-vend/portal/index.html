<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcd94a">
<title>Maru Power</title>
<link rel="icon" href="/power/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/power/power.css">
</head>
<body>
<header class="top">
  <a href="#/" class="brand" aria-label="Maru Power home"><img src="/power/logo.svg" alt="" width="34" height="34"><span><b>Maru</b> Power</span></a>
  <div class="top-actions" id="topActions" hidden>
    <a href="#/help" class="icon-btn" aria-label="Help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg></a>
    <button class="icon-btn" id="menuBtn" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
</header>
<div class="banner" id="testBanner" hidden>TEST ENVIRONMENT: payments are simulated and tokens will not load on a real meter.</div>
<nav class="drawer" id="drawer" hidden>
  <a href="#/">Dashboard</a>
  <a href="#/buy">Buy electricity</a>
  <a href="#/meters">My meters</a>
  <a href="#/link">Link a meter</a>
  <a href="#/transactions">Transactions</a>
  <a href="#/calculator">Appliance calculator</a>
  <a href="#/profile">Profile &amp; phone</a>
  <a href="#/help">Help</a>
  <button id="logoutBtn" class="link">Sign out</button>
</nav>
<main id="app" tabindex="-1"><div class="spinner"></div></main>
<nav class="tabbar" id="tabbar" hidden>
  <a href="#/" data-tab=""><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#/buy" data-tab="buy"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Buy</a>
  <a href="#/meters" data-tab="meters"><svg viewBox="0 0 24 24"><path d="M12 14l4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/></svg>Meters</a>
  <a href="#/transactions" data-tab="transactions"><svg viewBox="0 0 24 24"><path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 3 2V2l-3 2-3-2-3 2-3-2-3 2z"/><path d="M8 9h8M8 13h6"/></svg>History</a>
  <a href="#/calculator" data-tab="calculator"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h8"/></svg>Calculator</a>
</nav>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<footer>Maru Power by Maru Quick · prepaid electricity</footer>
<script src="/power/power.js"></script>
</body>
</html>
