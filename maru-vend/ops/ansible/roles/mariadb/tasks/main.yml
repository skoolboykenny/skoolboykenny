# MariaDB 10.11 with GTID replication. Every server boots read_only; mv-failover promotes one.
- name: MariaDB packages
  ansible.builtin.apt:
    name: [mariadb-server, mariadb-backup, mariadb-plugin-provider-lz4, python3-pymysql]
    state: present

- name: Server configuration
  ansible.builtin.template: { src: 60-maruvend.cnf.j2, dest: /etc/mysql/mariadb.conf.d/60-maruvend.cnf, mode: "0644" }
  notify: restart mariadb

- name: TLS material for client and replication connections
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/mysql/tls/{{ item | basename }}"
    owner: mysql
    mode: "0600"
  loop: "{{ mariadb_tls_files | default([]) }}"

- name: Firewall - database port from app and DB hosts only
  ansible.builtin.copy:
    dest: /etc/nftables.d/30-mariadb.nft
    content: |
      ip saddr { {{ (groups['app'] + groups['db'] + groups['lb']) | map('extract', hostvars, 'ansible_host') | join(', ') }} } tcp dport {{ db_port }} accept
      ip saddr { {{ groups['lb'] | map('extract', hostvars, 'ansible_host') | join(', ') }} } tcp dport 9200 accept
  notify: reload nftables

- name: MariaDB running
  ansible.builtin.service: { name: mariadb, state: started, enabled: true }

- name: Accounts (created on the bootstrap primary; they replicate to the others)
  when: inventory_hostname == groups['db'][0]
  ansible.mysql.mysql_user:
    login_unix_socket: /run/mysqld/mysqld.sock
    name: "{{ item.name }}"
    host: "{{ item.host }}"
    password: "{{ item.password }}"
    priv: "{{ item.priv }}"
    tls_requires: { SSL: "" }
    state: present
  loop:
    - { name: "{{ db_app_user }}", host: "%", password: "{{ db_app_pass }}", priv: "{{ db_name }}.*:SELECT,INSERT,UPDATE,DELETE,CREATE,ALTER,INDEX,REFERENCES" }
    - { name: "{{ db_repl_user }}", host: "%", password: "{{ db_repl_pass }}", priv: "*.*:REPLICATION SLAVE,REPLICATION CLIENT" }
    - { name: "{{ db_ops_user }}", host: "%", password: "{{ db_ops_pass }}", priv: "*.*:READ_ONLY ADMIN,REPLICATION SLAVE ADMIN,BINLOG MONITOR,SLAVE MONITOR,RELOAD,PROCESS,SELECT/{{ db_name }}.*:ALL" }
  no_log: true

- name: Audit log tables are append-only for the application account
  when: inventory_hostname == groups['db'][0]
  ansible.mysql.mysql_query:
    login_unix_socket: /run/mysqld/mysqld.sock
    query:
      - "REVOKE UPDATE, DELETE ON {{ db_name }}.* FROM '{{ db_app_user }}'@'%'"
      - "GRANT UPDATE, DELETE ON {{ db_name }}.vend_sales TO '{{ db_app_user }}'@'%'"
      - "GRANT UPDATE, DELETE ON {{ db_name }}.queue_jobs TO '{{ db_app_user }}'@'%'"
      - "GRANT UPDATE ON {{ db_name }}.float_position TO '{{ db_app_user }}'@'%'"
      - "GRANT UPDATE ON {{ db_name }}.settings TO '{{ db_app_user }}'@'%'"
      - "GRANT UPDATE ON {{ db_name }}.rate_limiter TO '{{ db_app_user }}'@'%'"
      - "GRANT UPDATE ON {{ db_name }}.audit_head TO '{{ db_app_user }}'@'%'"
      - "GRANT UPDATE ON {{ db_name }}.approvals TO '{{ db_app_user }}'@'%'"
      - "GRANT UPDATE ON {{ db_name }}.sms_outbox TO '{{ db_app_user }}'@'%'"
      - "GRANT UPDATE ON {{ db_name }}.users TO '{{ db_app_user }}'@'%'"
      - "GRANT UPDATE ON {{ db_name }}.support_tickets TO '{{ db_app_user }}'@'%'"
      - "GRANT UPDATE ON {{ db_name }}.designated_areas TO '{{ db_app_user }}'@'%'"
      - "GRANT UPDATE ON {{ db_name }}.merchants TO '{{ db_app_user }}'@'%'"
      - "GRANT UPDATE ON {{ db_name }}.channels TO '{{ db_app_user }}'@'%'"
  tags: [grants]
