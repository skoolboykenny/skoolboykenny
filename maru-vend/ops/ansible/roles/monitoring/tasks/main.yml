# Zabbix agent 2 with Maru Vend checks; alerts go to the on-call engineer by SMS and email.
- name: Zabbix agent
  ansible.builtin.apt: { name: zabbix-agent2, state: present }

- name: Agent configuration
  ansible.builtin.copy:
    dest: /etc/zabbix/zabbix_agent2.d/maruvend.conf
    content: |
      Server={{ zabbix_server }}
      ServerActive={{ zabbix_server }}
      Hostname={{ inventory_hostname }}
      HostMetadata=maruvend {{ mv_site }} {{ group_names | join(' ') }}
  notify: restart zabbix

- name: Maru Vend checks
  ansible.builtin.template: { src: userparams.conf.j2, dest: /etc/zabbix/zabbix_agent2.d/maruvend-checks.conf }
  notify: restart zabbix

- name: Running
  ansible.builtin.service: { name: zabbix-agent2, state: started, enabled: true }
