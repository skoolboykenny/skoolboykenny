# Three-member etcd: one voter at each site and one at the witness location. mv-failover writes
# the active-site decision here with compare-and-swap; mv-site-fence reads it every 5 seconds.
- name: etcd user
  ansible.builtin.user: { name: etcd, system: true, shell: /usr/sbin/nologin, home: /var/lib/etcd }

- name: etcd binaries
  ansible.builtin.unarchive:
    src: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: [--strip-components=1, --wildcards, "*/etcd", "*/etcdctl"]
    creates: /usr/local/bin/etcd

- name: etcd unit
  ansible.builtin.template: { src: etcd.service.j2, dest: /etc/systemd/system/etcd.service }
  notify: restart etcd

- name: Firewall - quorum ports between voters only
  ansible.builtin.copy:
    dest: /etc/nftables.d/40-etcd.nft
    content: |
      ip saddr { {{ (groups['quorum'] + groups['db']) | map('extract', hostvars, 'ansible_host') | join(', ') }} } tcp dport { 2379, 2380 } accept
  notify: reload nftables

- name: etcd running
  ansible.builtin.systemd: { name: etcd, state: started, enabled: true, daemon_reload: true }
