# Baseline for every server: patched, time-synced, hardened SSH, audited, host firewall.
- name: Set timezone
  community.general.timezone: { name: "{{ timezone }}" }
  ignore_errors: "{{ ansible_check_mode }}"

- name: Base packages
  ansible.builtin.apt:
    name: [chrony, unattended-upgrades, auditd, fail2ban, nftables, curl, jq, rsync, gnupg, ca-certificates, cryptsetup]
    state: present
    update_cache: true

- name: Automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: SSH hardening (keys only, no root)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-maruvend.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      MaxAuthTries 3
      AllowGroups maruops
  notify: restart ssh

- name: Kernel network hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-maruvend.conf
  loop: "{{ {'net.ipv4.conf.all.rp_filter': 1, 'net.ipv4.conf.all.accept_redirects': 0, 'net.ipv4.conf.all.send_redirects': 0, 'net.ipv4.tcp_syncookies': 1, 'kernel.kptr_restrict': 2} | dict2items }}"

- name: Audit rules (privileged commands, config and key changes)
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/maruvend.rules
    content: |
      -w /etc/maruvend/ -p wa -k maruvend-config
      -w /etc/swanctl/ -p wa -k vpn-config
      -w /etc/mysql/ -p wa -k db-config
      -w /etc/sudoers -p wa -k sudoers
      -a always,exit -F arch=b64 -S execve -F euid=0 -k root-exec
  notify: reload auditd

- name: Firewall rule directories
  ansible.builtin.file: { path: "{{ item }}", state: directory }
  loop: [/etc/nftables.d, /etc/nftables.d/forward]

- name: Host firewall (role-specific rules in /etc/nftables.d)
  ansible.builtin.template: { src: nftables.conf.j2, dest: /etc/nftables.conf, mode: "0640" }
  notify: reload nftables

- name: Firewall enabled
  ansible.builtin.service: { name: nftables, enabled: true, state: started }

- name: Disk encryption check (data volumes are LUKS-encrypted at build time)
  ansible.builtin.command: lsblk -o NAME,TYPE -nr
  register: lsblk
  changed_when: false
  check_mode: false

- name: Warn if no encrypted volume
  ansible.builtin.debug:
    msg: "WARNING: no LUKS (crypt) volume found on {{ inventory_hostname }}; data disks must be encrypted."
  when: "'crypt' not in lsblk.stdout"
