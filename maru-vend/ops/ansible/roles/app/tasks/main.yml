# Application servers: PHP 8.3-FPM behind nginx, queue workers, SMS sender, scheduled jobs.
- name: PHP and web packages
  ansible.builtin.apt:
    name: [php8.3-fpm, php8.3-cli, php8.3-mysql, php8.3-curl, php8.3-mbstring, php8.3-xml, php8.3-opcache, composer, nginx, git, gnupg]
    state: present

- name: Service account
  ansible.builtin.user: { name: maruvend, system: true, shell: /usr/sbin/nologin, home: "{{ mv_root }}" }

- name: Release directory
  ansible.builtin.file: { path: "{{ mv_root }}/releases", state: directory, owner: maruvend, mode: "0750" }

- name: Fetch release {{ mv_version }}
  ansible.builtin.git:
    repo: "{{ mv_repo }}"
    version: "{{ mv_version }}"
    dest: "{{ mv_root }}/releases/{{ mv_version }}"
    accept_hostkey: true
  become_user: maruvend
  register: release

- name: Install PHP dependencies (no dev packages)
  community.general.composer:
    command: install
    working_dir: "{{ mv_root }}/releases/{{ mv_version }}/maru-vend"
    no_dev: true
    optimize_autoloader: true
  become_user: maruvend

- name: Configuration and secrets (readable by the service account only)
  ansible.builtin.template: { src: env.j2, dest: /etc/maruvend/env, owner: root, group: maruvend, mode: "0640" }
  notify: [restart php-fpm, restart maruvend services]

- name: Schema migration (runs once, against the active primary through the DB VIP)
  ansible.builtin.shell: set -a && . /etc/maruvend/env && php bin/mv migrate
  args: { chdir: "{{ mv_root }}/releases/{{ mv_version }}/maru-vend" }
  run_once: true
  when: release.changed
  become_user: maruvend

- name: Switch current release atomically
  ansible.builtin.file:
    src: "{{ mv_root }}/releases/{{ mv_version }}/maru-vend"
    dest: "{{ mv_app_dir }}"
    state: link
    force: true
  notify: [restart php-fpm, restart maruvend services]

- name: PHP-FPM pool
  ansible.builtin.template: { src: fpm-pool.conf.j2, dest: /etc/php/8.3/fpm/pool.d/maruvend.conf }
  notify: restart php-fpm

- name: nginx sites
  ansible.builtin.template: { src: nginx-maruvend.conf.j2, dest: /etc/nginx/sites-enabled/maruvend.conf }
  notify: reload nginx

- name: Remove default site
  ansible.builtin.file: { path: /etc/nginx/sites-enabled/default, state: absent }
  notify: reload nginx

- name: systemd units
  ansible.builtin.template: { src: "{{ item }}.j2", dest: "/etc/systemd/system/{{ item }}" }
  loop:
    - maruvend-worker@.service
    - maruvend-sms.service
    - maruvend-sweep.service
    - maruvend-sweep.timer
    - maruvend-audit-anchor.service
    - maruvend-audit-anchor.timer
    - maruvend-audit-verify.service
    - maruvend-audit-verify.timer
  notify: restart maruvend services

- name: Queue workers ({{ workers_per_app_host }} per host). They stand by unless this site is active.
  ansible.builtin.systemd:
    name: "maruvend-worker@{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ range(1, workers_per_app_host + 1) | list }}"

- name: SMS sender and timers
  ansible.builtin.systemd: { name: "{{ item }}", enabled: true, state: started, daemon_reload: true }
  loop: [maruvend-sms.service, maruvend-sweep.timer, maruvend-audit-anchor.timer, maruvend-audit-verify.timer]

- name: Firewall - HTTP from the site load balancers only
  ansible.builtin.copy:
    dest: /etc/nftables.d/20-app.nft
    content: |
      ip saddr { {{ groups['lb'] | map('extract', hostvars, 'ansible_host') | join(', ') }} } tcp dport { 8080, 8081 } accept
  notify: reload nftables
