# Per site: an active/standby HAProxy pair sharing a virtual IP (keepalived).
# Public HTTPS for channels and the BPC dashboard; port 3307 for the application's database
# connections, always routed to the single writable primary (whichever site it is at).
- name: Packages
  ansible.builtin.apt: { name: [haproxy, keepalived], state: present }

- name: TLS certificate bundle
  ansible.builtin.copy: { src: "{{ lb_tls_pem }}", dest: /etc/haproxy/maruvend.pem, mode: "0600" }
  when: lb_tls_pem is defined

- name: HAProxy configuration
  ansible.builtin.template: { src: haproxy.cfg.j2, dest: /etc/haproxy/haproxy.cfg, validate: "haproxy -c -f %s" }
  notify: reload haproxy

- name: keepalived (VRRP) configuration
  ansible.builtin.template: { src: keepalived.conf.j2, dest: /etc/keepalived/keepalived.conf }
  notify: restart keepalived

- name: Firewall - public HTTPS, VRRP between the pair
  ansible.builtin.copy:
    dest: /etc/nftables.d/10-lb.nft
    content: |
      tcp dport { 80, 443 } accept
      ip protocol vrrp accept
      ip saddr { {{ groups['app'] | map('extract', hostvars, 'ansible_host') | join(', ') }} } tcp dport 3307 accept
  notify: reload nftables

- name: Running
  ansible.builtin.service: { name: "{{ item }}", state: started, enabled: true }
  loop: [haproxy, keepalived]
