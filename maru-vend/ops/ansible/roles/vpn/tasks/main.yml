# IPsec to BPC from a redundant gateway pair per site (clause 7.2/7.3). Only the queue workers'
# subnet is routed into the tunnel; channel networks have no route to BPC (nftables).
- name: strongSwan
  ansible.builtin.apt: { name: [strongswan-swanctl, charon-systemd, keepalived], state: present }

- name: Tunnel definition (policy enforces AES-256, SHA-256/384, DH19/14, RSA 2048)
  ansible.builtin.template: { src: swanctl.conf.j2, dest: /etc/swanctl/conf.d/bpc.conf, mode: "0600" }
  notify: reload swanctl

- name: Gateway certificate and key
  ansible.builtin.copy: { src: "{{ item.src }}", dest: "{{ item.dest }}", mode: "0600" }
  loop:
    - { src: "{{ vpn_cert | default('/dev/null') }}", dest: /etc/swanctl/x509/maruvend-gw.crt }
    - { src: "{{ vpn_key | default('/dev/null') }}", dest: /etc/swanctl/private/maruvend-gw.key }
  when: vpn_cert is defined

- name: IKE and ESP from BPC's peer
  ansible.builtin.template: { src: vpn-forward.nft.j2, dest: /etc/nftables.d/50-vpn.nft }
  notify: reload nftables

- name: Forward chain rules directory
  ansible.builtin.file: { path: /etc/nftables.d/forward, state: directory }

- name: Forwarding rules - XMLVend client subnet to BPC only, inside IPsec
  ansible.builtin.template: { src: vpn-route.nft.j2, dest: /etc/nftables.d/forward/50-vpn.nft }
  notify: reload nftables

- name: IP forwarding
  ansible.posix.sysctl: { name: net.ipv4.ip_forward, value: "1", sysctl_file: /etc/sysctl.d/60-vpn.conf }

- name: Running
  ansible.builtin.service: { name: strongswan, state: started, enabled: true }
