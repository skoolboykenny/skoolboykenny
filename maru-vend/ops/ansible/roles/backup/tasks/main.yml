# Encrypted backups kept in Botswana: nightly full + hourly incremental mariabackup from a replica,
# encrypted to the Maru Quick backup key, copied to the other site. Restores are tested monthly.
- name: Backup script
  ansible.builtin.template: { src: mv-backup.j2, dest: /usr/local/sbin/mv-backup, mode: "0750" }

- name: Backup units
  ansible.builtin.template: { src: "{{ item }}.j2", dest: "/etc/systemd/system/{{ item }}" }
  loop: ["mv-backup@.service", mv-backup-full.timer, mv-backup-incr.timer]

- name: Timers
  ansible.builtin.systemd: { name: "{{ item }}", enabled: true, state: started, daemon_reload: true }
  loop: [mv-backup-full.timer, mv-backup-incr.timer]
