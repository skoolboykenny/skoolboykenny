# Production inventory: replace <...> with the addresses issued by the data centres.
# Two sites in Botswana plus a small witness at a third location (quorum voter only).
all:
  vars:
    ansible_user: maruops
  children:
    site_primary:
      vars: { mv_site: primary }
      hosts:
        mv-p-lb1:   { ansible_host: "<10.10.0.11>", lb_priority: 150 }
        mv-p-lb2:   { ansible_host: "<10.10.0.12>", lb_priority: 100 }
        mv-p-app1:  { ansible_host: "<10.10.1.11>" }
        mv-p-app2:  { ansible_host: "<10.10.1.12>" }
        mv-p-db1:   { ansible_host: "<10.10.2.11>", mariadb_server_id: 11 }
        mv-p-db2:   { ansible_host: "<10.10.2.12>", mariadb_server_id: 12 }
        mv-p-vpn1:  { ansible_host: "<10.10.3.11>", vpn_priority: 150 }
        mv-p-vpn2:  { ansible_host: "<10.10.3.12>", vpn_priority: 100 }
    site_dr:
      vars: { mv_site: dr }
      hosts:
        mv-d-lb1:   { ansible_host: "<10.20.0.11>", lb_priority: 150 }
        mv-d-lb2:   { ansible_host: "<10.20.0.12>", lb_priority: 100 }
        mv-d-app1:  { ansible_host: "<10.20.1.11>" }
        mv-d-app2:  { ansible_host: "<10.20.1.12>" }
        mv-d-db1:   { ansible_host: "<10.20.2.11>", mariadb_server_id: 21 }
        mv-d-db2:   { ansible_host: "<10.20.2.12>", mariadb_server_id: 22 }
        mv-d-vpn1:  { ansible_host: "<10.20.3.11>", vpn_priority: 150 }
        mv-d-vpn2:  { ansible_host: "<10.20.3.12>", vpn_priority: 100 }
    witness:
      vars: { mv_site: witness }
      hosts:
        mv-witness: { ansible_host: "<10.30.0.11>" }
    lb:      { hosts: { mv-p-lb1: {}, mv-p-lb2: {}, mv-d-lb1: {}, mv-d-lb2: {} } }
    app:     { hosts: { mv-p-app1: {}, mv-p-app2: {}, mv-d-app1: {}, mv-d-app2: {} } }
    db:      { hosts: { mv-p-db1: {}, mv-p-db2: {}, mv-d-db1: {}, mv-d-db2: {} } }
    vpn:     { hosts: { mv-p-vpn1: {}, mv-p-vpn2: {}, mv-d-vpn1: {}, mv-d-vpn2: {} } }
    # One quorum voter per site plus the witness: any two can decide, one alone never can.
    quorum:  { hosts: { mv-p-db1: {}, mv-d-db1: {}, mv-witness: {} } }
