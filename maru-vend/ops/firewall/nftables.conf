# Maru Vend host firewall (nftables). Demonstrates at the site visit (2.3(d)) that no channel
# network has a route to BPC: only the XMLVend client hosts may reach the BPC vending gateway,
# and only through the IPsec tunnel.

define BPC_GATEWAY       = <bpc-vending-gateway-ip>
define XMLVEND_CLIENTS   = { <worker-host-1>, <worker-host-2> }
define CHANNEL_NETS      = { <pos-network>, <app-web-frontends>, <ussd-aggregator> }

table inet maruvend {
    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept

        # Only queue workers (XMLVend client) may reach BPC, and only via IPsec.
        ip saddr $XMLVEND_CLIENTS ip daddr $BPC_GATEWAY meta ipsec exists accept

        # Channels may reach the Maru Vend API over TLS only.
        ip saddr $CHANNEL_NETS tcp dport 443 accept

        # Everything else, including any channel -> BPC attempt, is dropped and logged.
        ip daddr $BPC_GATEWAY log prefix "DENY-TO-BPC " drop
    }
}
